<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>Лада — Уведомления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{margin:0;-webkit-font-smoothing:antialiased;background:#241A18;}
  * { box-sizing: border-box; }
  ::selection{ background:#F2C2C0; color:#2A1C1A; }
  a{ color:#F2C2C0; text-decoration:none; }
  a:hover{ color:#E8AEAC; }
  @media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important; } }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif; background:#241A18; color:#F5EBE8; min-height:100vh; display:flex;">

  <aside style="width:232px; flex:none; background:#2B201D; border-right:1px solid #4A3733; display:flex; flex-direction:column; padding:24px 16px; position:sticky; top:0; height:100vh;">
    <div onClick="{{ goToLanding }}" style="font-family:'Oswald',sans-serif; font-weight:800; font-size:20px; color:#F2C2C0; padding:0 8px; margin-bottom:28px;">ЛАДА</div>
    <nav style="display:flex; flex-direction:column; gap:2px; flex:1;">
      <sc-for list="{{ sidebarItems }}" as="si" hint-placeholder-count="5">
        <div onClick="{{ si.onClick }}" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:10px; background:{{ si.bg }}; color:{{ si.fg }}; font-size:13.5px; font-weight:600;">
          <div style="display:flex; align-items:center; gap:10px;"><i data-lucide="{{ si.icon }}" width="17" height="17" stroke-width="1.5"></i>{{ si.label }}</div>
          <sc-if value="{{ si.badge }}"><span style="width:18px; height:18px; border-radius:999px; background:#F2C2C0; color:#2A1C1A; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;">{{ si.badge }}</span></sc-if>
        </div>
      </sc-for>
    </nav>
    <button onClick="{{ goToBooking }}" style="background:#F2C2C0; color:#2A1C1A; border:none; border-radius:16px; padding:12px; font-size:13.5px; font-weight:700; font-family:'Manrope',sans-serif; display:flex; align-items:center; justify-content:center; gap:7px;"><i data-lucide="plus" width="16" height="16" stroke-width="2"></i>Новая запись</button>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">

    <header style="position:sticky; top:0; z-index:30; background:rgba(36,26,24,0.95); backdrop-filter:blur(8px); border-bottom:1px solid #4A3733;">
      <div style="padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
        <nav style="display:flex; gap:24px;">
          <sc-for list="{{ topNav }}" as="tn" hint-placeholder-count="4"><a href="#" style="font-size:13px; font-weight:600; color:#C4ADA8;">{{ tn }}</a></sc-for>
        </nav>
        <div style="display:flex; align-items:center; gap:18px;">
          <div style="position:relative;">
            <i data-lucide="bell" width="19" height="19" stroke-width="1.5" style="color:#F2C2C0;"></i>
            <div style="position:absolute; top:-5px; right:-6px; width:16px; height:16px; border-radius:999px; background:#F2C2C0; color:#2A1C1A; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center;">2</div>
          </div>
          <div onClick="{{ goToProfile }}" style="display:flex; align-items:center; gap:9px;">
            <div style="width:32px; height:32px; border-radius:999px; background:#3D2B28; color:#F2C2C0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;">АС</div>
            <span style="font-size:13px; font-weight:600; color:#F5EBE8;">Анна Соколова</span>
            <i data-lucide="chevron-down" width="14" height="14" stroke-width="1.5" style="color:#9A807A;"></i>
          </div>
        </div>
      </div>
    </header>

    <main style="padding:40px; flex:1; max-width:760px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
        <h1 style="font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:30px; margin:0;">Уведомления</h1>
        <a href="#" style="font-size:13px; font-weight:700;">Отметить все как прочитанные</a>
      </div>

      <div style="display:flex; gap:4px; background:#2B201D; border-radius:999px; padding:4px; width:fit-content; margin-bottom:28px;">
        <sc-for list="{{ filterChips }}" as="fc" hint-placeholder-count="2">
          <div style="padding:9px 18px; border-radius:999px; background:{{ fc.bg }}; color:{{ fc.fg }}; font-size:13px; font-weight:700;">{{ fc.label }}</div>
        </sc-for>
      </div>

      <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="3">
        <div style="margin-bottom:28px;">
          <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#9A807A; margin-bottom:12px;">{{ grp.title }}</div>
          <div style="display:flex; flex-direction:column; gap:1px; background:#4A3733; border:1px solid #4A3733; border-radius:20px; overflow:hidden;">
            <sc-for list="{{ grp.items }}" as="n" hint-placeholder-count="2">
              <div onClick="{{ n.action }}" style="display:flex; gap:14px; padding:16px 18px; background:{{ n.rowBg }}; align-items:flex-start; cursor:pointer;">
                <div style="width:36px; height:36px; border-radius:10px; background:{{ n.iconBg }}; display:flex; align-items:center; justify-content:center; flex:none;">
                  <i data-lucide="{{ n.icon }}" width="17" height="17" stroke-width="1.5" style="color:{{ n.iconColor }};"></i>
                </div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:13.5px; color:#F5EBE8; line-height:1.4;">{{ n.text }}</div>
                  <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
                    <span style="font-size:11.5px; color:#9A807A;">{{ n.time }}</span>
                    <sc-if value="{{ n.link }}"><a href="#" onClick="{{ n.action }}" style="font-size:12px; font-weight:700;">{{ n.link }}</a></sc-if>
                  </div>
                </div>
                <sc-if value="{{ n.unread }}"><div style="width:7px; height:7px; border-radius:999px; background:#F2C2C0; margin-top:5px; flex:none;"></div></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div>
        <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#6B5852; margin-bottom:10px;">Состояние фильтра «Непрочитанные»: пусто</div>
        <div style="background:#2B201D; border:1px dashed #4A3733; border-radius:20px; padding:32px; text-align:center;">
          <i data-lucide="check-circle-2" width="26" height="26" stroke-width="1.5" style="color:#9A807A; margin-bottom:10px;"></i>
          <div style="font-size:13.5px; font-weight:700; color:#F5EBE8;">Все уведомления прочитаны</div>
        </div>
      </div>
    </main>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ this.renderIcons(); }
  renderIcons(){ if(window.lucide) window.lucide.createIcons(); }
  renderVals(){
    const goToLanding = () => { window.location.href = 'Лада - Лендинг.dc.html'; };
    const goToBooking = () => { window.location.href = '1. Запись - Шаг 1. Услуги.dc.html'; };
    const goToRecords = () => { window.location.href = '7. Кабинет - Предстоящие записи.dc.html'; };
    const goToHistory = () => { window.location.href = '11. Кабинет - История записей.dc.html'; };
    const goToProfile = () => { window.location.href = '16. Кабинет - Профиль.dc.html'; };
    const goToDetails = () => { window.location.href = '9. Кабинет - Детали записи и отмена.dc.html'; };
    const sidebarItems = [
      {icon:'calendar', label:'Мои записи', bg:'transparent', fg:'#C4ADA8', badge:null, onClick:goToRecords},
      {icon:'history', label:'История', bg:'transparent', fg:'#C4ADA8', badge:null, onClick:goToHistory},
      {icon:'bell', label:'Уведомления', bg:'rgba(242,194,192,.14)', fg:'#F2C2C0', badge:'2', onClick:null},
      {icon:'user', label:'Профиль', bg:'transparent', fg:'#C4ADA8', badge:null, onClick:goToProfile},
      {icon:'log-out', label:'Выйти', bg:'transparent', fg:'#C4ADA8', badge:null, onClick:goToLanding},
    ];
    const topNav = ['Услуги','Мастера','Как записаться','Контакты'];
    const filterChips = ['Все','Непрочитанные'].map((label,i)=>({ label, bg: i===0?'#F2C2C0':'transparent', fg: i===0?'#2A1C1A':'#9A807A' }));

    const groups = [
      { title:'Сегодня', items:[
        { icon:'clock', iconBg:'rgba(242,194,192,.14)', iconColor:'#F2C2C0', text:'Напоминание: завтра в 14:00 — визит к Ольге Беловой', time:'сегодня, 09:00', link:'Открыть запись', unread:true, rowBg:'#3D2B28', action:goToDetails },
        { icon:'calendar-x', iconBg:'rgba(229,128,120,.14)', iconColor:'#E58078', text:'Студия отменила вашу запись на 20 августа. Причина: мастер заболел', time:'сегодня, 08:12', link:'Записаться заново', unread:true, rowBg:'#3D2B28', action:goToBooking },
      ]},
      { title:'Вчера', items:[
        { icon:'check-circle-2', iconBg:'rgba(143,191,120,.14)', iconColor:'#8FBF78', text:'Запись на 23 октября, 14:00 подтверждена', time:'вчера, 18:40', link:null, unread:false, rowBg:'#241A18', action:goToDetails },
      ]},
      { title:'Ранее', items:[
        { icon:'repeat', iconBg:'rgba(140,169,190,.14)', iconColor:'#8CA9BE', text:'Запись перенесена с 23 на 27 октября', time:'5 дней назад', link:null, unread:false, rowBg:'#241A18', action:goToDetails },
        { icon:'shield', iconBg:'#3D2B28', iconColor:'#9A807A', text:'Пароль изменён', time:'неделю назад', link:null, unread:false, rowBg:'#241A18', action:goToDetails },
      ]},
    ];

    return { sidebarItems, topNav, filterChips, groups, goToLanding, goToBooking, goToProfile, goToDetails };
  }
}

</script>
</body>
</html>
