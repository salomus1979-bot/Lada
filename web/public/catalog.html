<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Услуги и мастера</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>2. Список услуг и мастеров</h1>
<div id="msg" class="msg"></div>

<fieldset>
  <legend>Услуги — GET /api/services</legend>
  <form id="services-form">
    <label class="inline">Категория
      <select name="category" id="category"><option value="">все</option></select>
    </label>
    <label class="inline">Мастер
      <select name="master_id" id="master-filter"><option value="">любой</option></select>
    </label>
    <button type="submit">Показать услуги</button>
  </form>
  <div id="services"></div>
</fieldset>

<fieldset>
  <legend>Мастера — GET /api/masters</legend>
  <p class="muted">
    Фильтр <code>?service_ids=</code> оставляет только тех, кто делает все
    отмеченные услуги: визит целиком выполняет один мастер.
  </p>
  <div id="service-picker" class="muted">загрузка услуг…</div>
  <button id="load-masters">Показать мастеров</button>
  <button id="go-availability">Перейти к свободному времени →</button>
  <div id="masters"></div>
</fieldset>

<script src="app.js"></script>
<script>
'use strict';

const box = msgBox('msg');
let allServices = [];

renderNav();

/** Отмеченные в списке услуги — используются фильтром мастеров и переходом далее. */
const pickedServiceIds = () => Array.from(
  document.querySelectorAll('#service-picker input[type=checkbox]:checked'),
).map((input) => Number(input.value));

async function loadCategories() {
  const { categories } = await api('GET', '/service-categories');
  const select = document.getElementById('category');
  for (const category of categories) {
    select.append(el('option', { value: category.slug, textContent: category.title }));
  }
}

async function loadMastersIntoFilter() {
  const { masters } = await api('GET', '/masters');
  const select = document.getElementById('master-filter');
  for (const master of masters) {
    select.append(el('option', { value: String(master.id), textContent: master.display_name }));
  }
}

async function loadServices(params = {}) {
  const { services } = await api('GET', `/services${qs(params)}`);
  const block = document.getElementById('services');
  block.textContent = '';
  if (services.length === 0) {
    block.append(el('p', { className: 'muted', textContent: 'Под фильтр ничего не подошло.' }));
    return services;
  }
  block.append(table([
    ['id', (s) => s.id],
    ['Категория', (s) => s.category.title],
    ['Услуга', (s) => s.name],
    ['Описание', (s) => s.description],
    ['Длительность', (s) => `${s.duration_min} мин`],
    ['Цена', (s) => s.price_display],
  ], services));
  return services;
}

/** Чекбоксы услуг для фильтра мастеров и для перехода к свободному времени. */
function renderServicePicker(services) {
  const block = document.getElementById('service-picker');
  block.textContent = '';
  block.className = '';
  if (services.length === 0) {
    block.className = 'muted';
    block.textContent = 'Услуг в каталоге нет.';
    return;
  }
  for (const service of services) {
    block.append(el('label', { className: 'inline' },
      el('input', { type: 'checkbox', value: String(service.id) }),
      ` ${service.name} (${service.duration_min} мин, ${service.price_display})`));
  }
}

async function loadMasters() {
  const ids = pickedServiceIds();
  const { masters } = await api('GET', `/masters${qs({ service_ids: ids.join(',') })}`);
  const block = document.getElementById('masters');
  block.textContent = '';
  if (masters.length === 0) {
    block.append(el('p', {
      className: 'msg info',
      textContent: 'Нет мастера, который делает все выбранные услуги. Снимите часть отметок.',
    }));
    return;
  }
  block.append(table([
    ['id', (m) => m.id],
    ['Мастер', (m) => m.display_name],
    ['Специализация', (m) => m.specialization],
    ['Опыт', (m) => (m.experience_years === null ? '—' : `${m.experience_years} г.`)],
    ['Услуги (id)', (m) => m.service_ids.join(', ')],
    ['', (m) => {
      const link = el('a', {
        textContent: 'свободное время →',
        href: `availability.html${qs({ master_id: m.id, service_ids: ids.join(',') })}`,
      });
      return link;
    }],
  ], masters));
}

document.getElementById('services-form').onsubmit = guard(box, async (event) => {
  event.preventDefault();
  box.clear();
  const values = formValues(event.target);
  await loadServices({ category: values.category, master_id: values.master_id });
});

document.getElementById('load-masters').onclick = guard(box, async () => {
  box.clear();
  await loadMasters();
});

document.getElementById('go-availability').onclick = () => {
  const ids = pickedServiceIds();
  location.href = `availability.html${qs({ service_ids: ids.join(',') })}`;
};

guard(box, async () => {
  await Promise.all([loadCategories(), loadMastersIntoFilter()]);
  allServices = await loadServices();
  renderServicePicker(allServices);
  await loadMasters();
})();
</script>
</body>
</html>
