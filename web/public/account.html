<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>5. Личный кабинет</h1>
<div id="msg" class="msg"></div>

<fieldset>
  <legend>Мои записи — GET /api/appointments?scope=</legend>
  <form id="list-form">
    <label class="inline">Выборка
      <select name="scope">
        <option value="upcoming">upcoming — предстоящие</option>
        <option value="past">past — прошедшие и отменённые</option>
        <option value="all">all — все</option>
      </select>
    </label>
    <button type="submit">Показать</button>
  </form>
  <div id="list"></div>
</fieldset>

<fieldset>
  <legend>Детали записи — GET /api/appointments/:id</legend>
  <form id="detail-form">
    <label class="inline">Номер записи <input type="number" name="id" min="1" required></label>
    <button type="submit">Открыть</button>
  </form>
  <div id="detail" class="muted">Выберите запись в списке или введите номер.</div>
</fieldset>

<fieldset id="actions" hidden>
  <legend>Перенос и отмена</legend>

  <h3>Перенос — POST /api/appointments/:id/reschedule</h3>
  <p class="muted" id="reschedule-rules"></p>
  <form id="reschedule-form">
    <label class="inline">Дата для поиска времени <input type="date" name="date"></label>
    <button type="button" id="find-slots">Показать свободное время мастера</button>
    <div id="slots"></div>
    <label>Новое начало, UTC
      <input type="text" name="starts_at" id="reschedule-at" placeholder="2026-10-23T11:00:00Z" required>
    </label>
    <button type="submit">Перенести</button>
  </form>

  <h3>Отмена — POST /api/appointments/:id/cancel</h3>
  <p class="muted" id="cancel-rules"></p>
  <form id="cancel-form">
    <label>Причина (необязательно)
      <input type="text" name="cancel_reason" maxlength="500">
    </label>
    <button type="submit">Отменить запись</button>
  </form>
</fieldset>

<script src="app.js"></script>
<script>
'use strict';

const box = msgBox('msg');
let current = null; // открытая запись

renderNav();

const statusOf = (a) => `${a.status} — ${a.status_label}`;

async function loadList(scope) {
  const data = await api('GET', `/appointments${qs({ scope })}`);
  const block = document.getElementById('list');
  block.textContent = '';
  if (data.appointments.length === 0) {
    block.append(el('p', {
      className: 'msg info',
      textContent: scope === 'upcoming'
        ? 'Предстоящих записей нет. Создайте запись на странице 4.'
        : 'В этой выборке записей нет.',
    }));
    return;
  }
  block.append(table([
    ['№', (a) => a.id],
    ['Когда', (a) => whenText(a.starts_at)],
    ['Мастер', (a) => a.master.display_name],
    ['Услуги', (a) => a.services.map((s) => s.name).join(', ')],
    ['Сумма', (a) => a.total_price_display],
    ['Статус', statusOf],
    ['Переносов', (a) => `${a.reschedule_count} (осталось ${a.reschedules_left})`],
    ['', (a) => {
      const button = el('button', { textContent: 'Детали' });
      button.onclick = guard(box, async () => {
        box.clear();
        await openDetail(a.id);
      });
      return button;
    }],
  ], data.appointments));
}

/** Детали записи и доступные действия: права приходят вместе с записью. */
async function openDetail(id) {
  const { appointment } = await api('GET', `/appointments/${id}`);
  current = appointment;
  document.querySelector('#detail-form input[name=id]').value = id;

  const block = document.getElementById('detail');
  block.className = '';
  block.textContent = '';
  block.append(table([
    ['Поле', (r) => r[0]],
    ['Значение', (r) => r[1]],
  ], [
    ['Номер', appointment.id],
    ['Статус', statusOf(appointment)],
    ['Мастер', `${appointment.master.display_name} (id ${appointment.master.id})`],
    ['Когда', appointment.when_display || whenText(appointment.starts_at)],
    ['Начало UTC', appointment.starts_at.at_utc],
    ['Конец', whenText(appointment.ends_at)],
    ['Длительность', `${appointment.service_duration_min} мин`],
    ['Услуги', appointment.services.map((s) => `${s.name} — ${s.price_display}`).join('; ')],
    ['Сумма', appointment.total_price_display],
    ['Комментарий', appointment.client_comment],
    ['Причина отмены', appointment.cancel_reason],
    ['Переносов', appointment.reschedule_count],
    ['Создана (UTC)', appointment.created_at_utc],
    ['Клиент (видно персоналу)', appointment.client ? `${appointment.client.name}, ${appointment.client.phone}` : '—'],
  ]));

  renderActions(appointment);
}

/**
 * Кнопки переноса и отмены включаются по правилам из ответа API
 * (can_cancel, can_reschedule, reschedules_left), а не по догадкам страницы.
 * У персонала этих полей в ответе нет — тогда ограничений не показываем.
 */
function renderActions(appointment) {
  const actions = document.getElementById('actions');
  actions.hidden = false;

  const clientRules = appointment.can_cancel !== undefined;
  const cancelWindow = appointment.cancel_window_hours;

  const rescheduleButton = document.querySelector('#reschedule-form button[type=submit]');
  const cancelButton = document.querySelector('#cancel-form button[type=submit]');

  if (clientRules) {
    rescheduleButton.disabled = !appointment.can_reschedule;
    cancelButton.disabled = !appointment.can_cancel;
    document.getElementById('reschedule-rules').textContent = appointment.can_reschedule
      ? `Доступно: осталось переносов — ${appointment.reschedules_left}, не позднее чем за ${cancelWindow} ч до визита.`
      : `Перенос недоступен: либо запись уже не активна, либо до визита меньше ${cancelWindow} ч, `
        + `либо исчерпан лимит переносов (осталось ${appointment.reschedules_left}).`;
    document.getElementById('cancel-rules').textContent = appointment.can_cancel
      ? `Доступно: отмена не позднее чем за ${cancelWindow} ч до визита.`
      : 'Отмена недоступна: запись не активна или до визита меньше разрешённого окна.';
  } else {
    rescheduleButton.disabled = false;
    cancelButton.disabled = false;
    const staffNote = 'Запись открыта сотрудником студии: ограничения клиента (окно и лимит переносов) не применяются.';
    document.getElementById('reschedule-rules').textContent = staffNote;
    document.getElementById('cancel-rules').textContent = staffNote;
  }

  document.getElementById('reschedule-at').value = '';
  document.getElementById('slots').textContent = '';
  const dateInput = document.querySelector('#reschedule-form input[name=date]');
  dateInput.value = appointment.starts_at.local_date;
}

/** Свободное время того же мастера и тех же услуг — перенос только внутри них. */
async function findSlots() {
  if (!current) {
    box.error('Сначала откройте запись.');
    return;
  }
  const date = document.querySelector('#reschedule-form input[name=date]').value;
  if (!date) {
    box.error('Укажите дату для поиска свободного времени.');
    return;
  }
  const serviceIds = current.services.map((s) => s.service_id).join(',');
  const data = await api('GET', `/masters/${current.master.id}/availability${qs({
    date, service_ids: serviceIds,
  })}`);

  const block = document.getElementById('slots');
  block.textContent = '';
  if (data.slots.length === 0) {
    block.append(el('p', {
      className: 'msg info',
      textContent: 'На эту дату у мастера нет свободного времени под эту длительность.',
    }));
    return;
  }
  for (const slot of data.slots) {
    const button = el('button', {
      type: 'button',
      className: 'slot',
      textContent: slot.local_time,
      title: `UTC: ${slot.at_utc}`,
    });
    button.onclick = () => {
      document.getElementById('reschedule-at').value = slot.at_utc;
      box.info(`Выбрано ${data.date} ${slot.local_time}. Нажмите «Перенести».`);
    };
    block.append(button);
  }
}

/** Общий разбор 409 «время занято» для переноса. */
function showOverlap(err) {
  const slots = (err.details && err.details.nearest_slots) || [];
  box.error([
    'Это время уже занято — перенос не выполнен. Выберите другое время.',
    slots.length > 0
      ? `Ближайшее свободное: ${slots.map((s) => `${s.local_date} ${s.local_time}`).join(', ')}`
      : 'Свободных начал рядом API не нашёл — посмотрите другую дату.',
  ].join('\n'));
}

document.getElementById('list-form').onsubmit = guard(box, async (event) => {
  event.preventDefault();
  box.clear();
  await loadList(formValues(event.target).scope);
});

document.getElementById('detail-form').onsubmit = guard(box, async (event) => {
  event.preventDefault();
  box.clear();
  await openDetail(Number(formValues(event.target).id));
});

document.getElementById('find-slots').onclick = guard(box, async () => {
  box.clear();
  await findSlots();
});

document.getElementById('reschedule-form').onsubmit = guard(box, async (event) => {
  event.preventDefault();
  box.clear();
  if (!current) {
    box.error('Сначала откройте запись.');
    return;
  }
  const values = formValues(event.target);
  try {
    const { appointment } = await api('POST', `/appointments/${current.id}/reschedule`, {
      starts_at: values.starts_at,
    });
    box.ok(`Запись перенесена на ${appointment.when_display || whenText(appointment.starts_at)}.`);
    await openDetail(appointment.id);
    await loadList(formValues(document.getElementById('list-form')).scope);
  } catch (err) {
    if (err instanceof ApiError && err.status === 409 && err.details
        && err.details.reason === 'overlap') {
      showOverlap(err);
      return;
    }
    throw err;
  }
});

document.getElementById('cancel-form').onsubmit = guard(box, async (event) => {
  event.preventDefault();
  box.clear();
  if (!current) {
    box.error('Сначала откройте запись.');
    return;
  }
  const values = formValues(event.target);
  const { appointment } = await api('POST', `/appointments/${current.id}/cancel`, {
    cancel_reason: optional(values.cancel_reason),
  });
  box.ok(`Запись отменена: статус ${statusOf(appointment)}.`);
  event.target.reset();
  await openDetail(appointment.id);
  await loadList(formValues(document.getElementById('list-form')).scope);
});

guard(box, async () => {
  await loadList('upcoming');
})();
</script>
</body>
</html>
