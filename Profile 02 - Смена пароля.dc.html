<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>Лада — Смена пароля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{margin:0;-webkit-font-smoothing:antialiased;background:#241A18;}
  * { box-sizing: border-box; }
  ::selection{ background:#F2C2C0; color:#2A1C1A; }
  a{ color:#F2C2C0; text-decoration:none; }
  a:hover{ color:#E8AEAC; }
  @media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important; } }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif; background:#241A18; color:#F5EBE8; min-height:100vh; display:flex;">

  <aside style="width:232px; flex:none; background:#2B201D; border-right:1px solid #4A3733; display:flex; flex-direction:column; padding:24px 16px; position:sticky; top:0; height:100vh;">
    <div style="font-family:'Oswald',sans-serif; font-weight:800; font-size:20px; color:#F2C2C0; padding:0 8px; margin-bottom:28px;">ЛАДА</div>
    <nav style="display:flex; flex-direction:column; gap:2px; flex:1;">
      <sc-for list="{{ sidebarItems }}" as="si" hint-placeholder-count="5">
        <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:{{ si.bg }}; color:{{ si.fg }}; font-size:13.5px; font-weight:600;">
          <i data-lucide="{{ si.icon }}" width="17" height="17" stroke-width="1.5"></i>{{ si.label }}
        </div>
      </sc-for>
    </nav>
    <button style="background:#F2C2C0; color:#2A1C1A; border:none; border-radius:16px; padding:12px; font-size:13.5px; font-weight:700; font-family:'Manrope',sans-serif; display:flex; align-items:center; justify-content:center; gap:7px;"><i data-lucide="plus" width="16" height="16" stroke-width="2"></i>Новая запись</button>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <header style="position:sticky; top:0; z-index:30; background:rgba(36,26,24,0.95); backdrop-filter:blur(8px); border-bottom:1px solid #4A3733;">
      <div style="padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
        <nav style="display:flex; gap:24px;">
          <sc-for list="{{ topNav }}" as="tn" hint-placeholder-count="4"><a href="#" style="font-size:13px; font-weight:600; color:#C4ADA8;">{{ tn }}</a></sc-for>
        </nav>
        <div style="display:flex; align-items:center; gap:18px;">
          <i data-lucide="bell" width="19" height="19" stroke-width="1.5" style="color:#C4ADA8;"></i>
          <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:32px; height:32px; border-radius:999px; background:#3D2B28; color:#F2C2C0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;">АС</div>
            <span style="font-size:13px; font-weight:600; color:#F5EBE8;">Анна Соколова</span>
          </div>
        </div>
      </div>
    </header>

    <main style="padding:40px; flex:1; display:grid; grid-template-columns:200px minmax(0,1fr); gap:32px; max-width:920px;">
      <div>
        <h1 style="font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:28px; margin:0 0 24px;">Профиль</h1>
        <nav style="display:flex; flex-direction:column; gap:2px;">
          <sc-for list="{{ subNav }}" as="sn" hint-placeholder-count="3">
            <div style="padding:10px 14px; border-radius:10px; background:{{ sn.bg }}; color:{{ sn.fg }}; font-size:13.5px; font-weight:600;">{{ sn.label }}</div>
          </sc-for>
        </nav>
      </div>

      <div style="min-width:0; display:flex; flex-direction:column; gap:20px;">
        <div style="background:#2B201D; border:1px solid #4A3733; border-radius:24px; padding:28px;">
          <div style="font-size:14px; font-weight:700; margin-bottom:20px;">Смена пароля</div>
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Текущий пароль</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:16px;" />
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Новый пароль</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:6px;" />
          <div style="display:flex; gap:4px; margin-bottom:6px;">
            <sc-for list="{{ strengthBars }}" as="b" hint-placeholder-count="4"><div style="height:4px; flex:1; border-radius:2px; background:{{ b }};"></div></sc-for>
          </div>
          <div style="font-size:11px; color:#9A807A; margin-bottom:16px;">Минимум 8 символов, буквы и цифры</div>
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Подтверждение нового пароля</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:20px;" />
          <button style="background:#F2C2C0; color:#2A1C1A; border:none; border-radius:16px; padding:11px 22px; font-size:13.5px; font-weight:700; font-family:'Manrope',sans-serif;">Изменить пароль</button>
        </div>

        <div style="background:#2B201D; border:1px solid #4A3733; border-radius:24px; padding:28px;">
          <div style="font-size:14px; font-weight:700; margin-bottom:16px;">Активные сессии</div>
          <div style="display:flex; flex-direction:column; gap:1px; background:#4A3733; border-radius:14px; overflow:hidden;">
            <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="2">
              <div style="display:flex; align-items:center; gap:14px; padding:14px 16px; background:#2B201D;">
                <i data-lucide="{{ s.icon }}" width="20" height="20" stroke-width="1.5" style="color:#9A807A; flex:none;"></i>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:13px; font-weight:600; color:#F5EBE8;">{{ s.device }}</div>
                  <div style="font-size:11.5px; color:#9A807A;">{{ s.location }} · {{ s.time }}</div>
                </div>
                <button style="background:transparent; color:#E58078; border:1.5px solid #4A3733; border-radius:12px; padding:8px 14px; font-size:12px; font-weight:700; font-family:'Manrope',sans-serif; white-space:nowrap; flex:none;">Завершить</button>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ this.renderIcons(); }
  renderIcons(){ if(window.lucide) window.lucide.createIcons(); }
  renderVals(){
    const sidebarItems = [
      {icon:'calendar', label:'Мои записи', bg:'transparent', fg:'#C4ADA8'},
      {icon:'history', label:'История', bg:'transparent', fg:'#C4ADA8'},
      {icon:'bell', label:'Уведомления', bg:'transparent', fg:'#C4ADA8'},
      {icon:'user', label:'Профиль', bg:'rgba(242,194,192,.14)', fg:'#F2C2C0'},
      {icon:'log-out', label:'Выйти', bg:'transparent', fg:'#C4ADA8'},
    ];
    const topNav = ['Услуги','Мастера','Как записаться','Контакты'];
    const subNav = [
      {label:'Личные данные', bg:'transparent', fg:'#C4ADA8'},
      {label:'Безопасность', bg:'rgba(242,194,192,.14)', fg:'#F2C2C0'},
      {label:'Уведомления', bg:'transparent', fg:'#C4ADA8'},
    ];
    const sessions = [
      {icon:'monitor', device:'Chrome · Windows', location:'Москва', time:'сейчас'},
      {icon:'smartphone', device:'Safari · iPhone', location:'Москва', time:'вчера, 21:40'},
    ];
    return { sidebarItems, topNav, subNav, strengthBars:['#8FBF78','#8FBF78','#8FBF78','#4A3733'], sessions };
  }
}

</script>
</body>
</html>
