<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>Лада — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{margin:0;-webkit-font-smoothing:antialiased;background:#241A18;}
  * { box-sizing: border-box; }
  ::selection{ background:#F2C2C0; color:#2A1C1A; }
  a{ color:#F2C2C0; text-decoration:none; }
  a:hover{ color:#E8AEAC; }
  @media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important; } }
</style>
</helmet>

<div style="font-family:'Manrope',sans-serif; background:#241A18; color:#F5EBE8; min-height:100vh; display:flex; position:relative;">

  <aside style="width:232px; flex:none; background:#2B201D; border-right:1px solid #4A3733; display:flex; flex-direction:column; padding:24px 16px; position:sticky; top:0; height:100vh;">
    <div onClick="{{ goToLanding }}" style="font-family:'Oswald',sans-serif; font-weight:800; font-size:20px; color:#F2C2C0; padding:0 8px; margin-bottom:28px;">ЛАДА</div>
    <nav style="display:flex; flex-direction:column; gap:2px; flex:1;">
      <sc-for list="{{ sidebarItems }}" as="si" hint-placeholder-count="5">
        <div onClick="{{ si.onClick }}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:{{ si.bg }}; color:{{ si.fg }}; font-size:13.5px; font-weight:600;">
          <i data-lucide="{{ si.icon }}" width="17" height="17" stroke-width="1.5"></i>{{ si.label }}
        </div>
      </sc-for>
    </nav>
    <button onClick="{{ goToBooking }}" style="background:#F2C2C0; color:#2A1C1A; border:none; border-radius:16px; padding:12px; font-size:13.5px; font-weight:700; font-family:'Manrope',sans-serif; display:flex; align-items:center; justify-content:center; gap:7px;"><i data-lucide="plus" width="16" height="16" stroke-width="2"></i>Новая запись</button>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">

    <header style="position:sticky; top:0; z-index:30; background:rgba(36,26,24,0.95); backdrop-filter:blur(8px); border-bottom:1px solid #4A3733;">
      <div style="padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
        <nav style="display:flex; gap:24px;">
          <sc-for list="{{ topNav }}" as="tn" hint-placeholder-count="4"><a href="#" style="font-size:13px; font-weight:600; color:#C4ADA8;">{{ tn }}</a></sc-for>
        </nav>
        <div style="display:flex; align-items:center; gap:18px;">
          <i data-lucide="bell" width="19" height="19" stroke-width="1.5" style="color:#C4ADA8;"></i>
          <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:32px; height:32px; border-radius:999px; background:#3D2B28; color:#F2C2C0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;">АС</div>
            <span style="font-size:13px; font-weight:600; color:#F5EBE8;">Анна Соколова</span>
            <i data-lucide="chevron-down" width="14" height="14" stroke-width="1.5" style="color:#9A807A;"></i>
          </div>
        </div>
      </div>
    </header>

    <main style="padding:40px; flex:1; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr); gap:28px; align-items:start;">

      <div style="min-width:0; display:flex; flex-direction:column; gap:20px;">
        <h1 style="font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:30px; margin:0;">Профиль</h1>

        <div style="background:#2B201D; border:1px solid #4A3733; border-radius:24px; padding:26px;">
          <div style="font-size:14px; font-weight:700; color:#F5EBE8; margin-bottom:20px;">Личные данные</div>
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:22px;">
            <div style="width:64px; height:64px; border-radius:999px; background:#3D2B28; color:#F2C2C0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; flex:none;">АС</div>
            <button style="background:transparent; color:#F2C2C0; border:1.5px solid #4A3733; border-radius:16px; padding:9px 16px; font-size:12.5px; font-weight:700; font-family:'Manrope',sans-serif; display:flex; align-items:center; gap:6px;"><i data-lucide="upload" width="14" height="14" stroke-width="1.5"></i>Загрузить фото</button>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;">
            <div>
              <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Имя</label>
              <input value="Анна Соколова" readonly="{{ true }}" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif;" />
            </div>
            <div>
              <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Дата рождения</label>
              <input placeholder="дд.мм.гггг" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif;" />
            </div>
            <div>
              <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">E-mail</label>
              <input value="anna.sokolova@mail.ru" readonly="{{ true }}" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif;" />
            </div>
            <div>
              <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Телефон</label>
              <input value="+7 (999) 123-45-67" readonly="{{ true }}" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif;" />
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button disabled="{{ true }}" style="background:transparent; color:#6B5852; border:1.5px solid #4A3733; border-radius:16px; padding:10px 18px; font-size:13px; font-weight:700; font-family:'Manrope',sans-serif; opacity:.6; cursor:not-allowed;">Отмена</button>
            <button disabled="{{ true }}" style="background:#4A3733; color:#9A807A; border:none; border-radius:16px; padding:10px 20px; font-size:13px; font-weight:700; font-family:'Manrope',sans-serif; opacity:.6; cursor:not-allowed;">Сохранить</button>
          </div>
        </div>

        <div style="background:#2B201D; border:1px solid #4A3733; border-radius:24px; padding:26px;">
          <div style="font-size:14px; font-weight:700; color:#F5EBE8; margin-bottom:20px;">Смена пароля</div>
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Текущий пароль</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:14px;" />
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Новый пароль</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:6px;" />
          <div style="display:flex; gap:4px; margin-bottom:14px;">
            <sc-for list="{{ strengthBars }}" as="b" hint-placeholder-count="4"><div style="height:4px; flex:1; border-radius:2px; background:{{ b }};"></div></sc-for>
          </div>
          <label style="display:block; font-size:12px; font-weight:600; color:#C4ADA8; margin-bottom:6px;">Повторите пароль</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#332522; border:1px solid #4A3733; border-radius:8px; padding:11px 14px; font-size:14px; color:#F5EBE8; font-family:'Manrope',sans-serif; margin-bottom:18px;" />
          <div style="display:flex; justify-content:flex-end;">
            <button style="background:#F2C2C0; color:#2A1C1A; border:none; border-radius:16px; padding:10px 20px; font-size:13px; font-weight:700; font-family:'Manrope',sans-serif;">Изменить пароль</button>
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px; min-width:0;">
        <div style="background:#2B201D; border:1px solid #4A3733; border-radius:24px; padding:22px;">
          <div style="font-size:14px; font-weight:700; color:#F5EBE8; margin-bottom:16px;">Уведомления</div>
          <div style="display:flex; flex-direction:column; gap:14px; margin-bottom:12px;">
            <sc-for list="{{ notifSwitches }}" as="ns" hint-placeholder-count="3">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                <span style="font-size:13px; color:#C4ADA8;">{{ ns.label }}</span>
                <div style="width:34px; height:20px; border-radius:999px; background:{{ ns.bg }}; position:relative; flex:none;"></div>
              </div>
            </sc-for>
          </div>
          <div style="font-size:11.5px; color:#6B5852;">Уведомления приходят в личный кабинет</div>
        </div>

        <div style="background:rgba(229,128,120,.08); border:1px solid rgba(229,128,120,.3); border-radius:24px; padding:22px;">
          <div style="font-size:14px; font-weight:700; color:#F5EBE8; margin-bottom:8px;">Удалить аккаунт</div>
          <div style="font-size:12.5px; color:#9A807A; line-height:1.5; margin-bottom:16px;">Действие необратимо: все записи и история будут удалены без возможности восстановления.</div>
          <button style="width:100%; background:transparent; color:#E58078; border:1.5px solid #E58078; border-radius:16px; padding:10px; font-size:13px; font-weight:700; font-family:'Manrope',sans-serif;">Удалить аккаунт</button>
        </div>
      </div>

    </main>
  </div>

  <div style="position:fixed; right:28px; bottom:28px; background:#3D2B28; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 16px rgba(36,26,24,.3); z-index:100;">
    <i data-lucide="check-circle-2" width="18" height="18" stroke-width="1.5" style="color:#8FBF78; flex:none;"></i>
    <span style="font-size:13px; font-weight:600; color:#F5EBE8;">Изменения сохранены</span>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ this.renderIcons(); }
  renderIcons(){ if(window.lucide) window.lucide.createIcons(); }
  renderVals(){
    const goToLanding = () => { window.location.href = 'Лада - Лендинг.dc.html'; };
    const goToBooking = () => { window.location.href = '1. Запись - Шаг 1. Услуги.dc.html'; };
    const goToRecords = () => { window.location.href = '7. Кабинет - Предстоящие записи.dc.html'; };
    const goToHistory = () => { window.location.href = '11. Кабинет - История записей.dc.html'; };
    const goToNotifications = () => { window.location.href = '17. Кабинет - Уведомления.dc.html'; };
    const sidebarItems = [
      {icon:'calendar', label:'Мои записи', bg:'transparent', fg:'#C4ADA8', onClick:goToRecords},
      {icon:'history', label:'История', bg:'transparent', fg:'#C4ADA8', onClick:goToHistory},
      {icon:'bell', label:'Уведомления', bg:'transparent', fg:'#C4ADA8', onClick:goToNotifications},
      {icon:'user', label:'Профиль', bg:'rgba(242,194,192,.14)', fg:'#F2C2C0', onClick:null},
      {icon:'log-out', label:'Выйти', bg:'transparent', fg:'#C4ADA8', onClick:goToLanding},
    ];
    const topNav = ['Услуги','Мастера','Как записаться','Контакты'];
    const notifSwitches = [
      {label:'Напоминание о визите', bg:'#F2C2C0'},
      {label:'Изменения в записи', bg:'#F2C2C0'},
      {label:'Новости студии', bg:'#4A3733'},
    ];
    return { sidebarItems, topNav, notifSwitches, strengthBars: ['#8FBF78','#8FBF78','#8FBF78','#4A3733'], goToLanding, goToBooking };
  }
}

</script>
</body>
</html>
